name: Publish update
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content SafeUninstall/SafeUninstall.csproj
          if ("v$($project.Project.PropertyGroup.Version)" -ne $env:GITHUB_REF_NAME) {
            throw 'Tag must match the project Version.'
          }
      - run: dotnet publish SafeUninstall/SafeUninstall.csproj -c Release -r win-x64 --self-contained true -o artifacts/app
      - name: Package update
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/SafeUninstall-win-x64.zip
          $hash = (Get-FileHash artifacts/SafeUninstall-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SafeUninstall-win-x64.zip" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" artifacts/SafeUninstall-win-x64.zip artifacts/SHA256SUMS.txt --verify-tag --generate-notes --title "SafeUninstall $env:GITHUB_REF_NAME"
